spring.application.name=workation-platform
server.port=8080

# --- MySQL datasource ---------------------------------------------------------
# createDatabaseIfNotExist=true lets the app create the schema on first run.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workflex}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# --- CSV import ---------------------------------------------------------------
# When true, the CSV bundled on the classpath is imported automatically on startup
# (idempotent: rows are keyed by workationId so a restart won't create duplicates).
workflex.csv.import-on-startup=true
workflex.csv.location=classpath:workations.csv

# --- CORS ---------------------------------------------------------------------
# Allowed origin for the Angular dev server.
workflex.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

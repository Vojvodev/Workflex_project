# In-memory H2 database for tests (MySQL not required to run the test suite).
spring.datasource.url=jdbc:h2:mem:workflex;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Tests trigger imports explicitly, so disable the startup importer.
workflex.csv.import-on-startup=false
workflex.csv.location=classpath:workations.csv
workflex.cors.allowed-origin=http://localhost:4200
